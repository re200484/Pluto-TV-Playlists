name: Auto Pluto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Evita che due run sovrapposti si sovrascrivano a vicenda con il force-push
concurrency:
  group: auto-pluto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: node index.js

      # Ogni run pubblica le playlist come UN SOLO commit radice e sostituisce
      # main. In questo modo la storia raggiungibile resta ~35 MB invece di
      # crescere di ~3 MB a ogni aggiornamento orario. I vecchi commit
      # diventano irraggiungibili e vengono rimossi dal GC automatico di GitHub.
      - name: Publish playlists as a single commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Se output/ non è cambiato non serve creare un altro commit
          git add -A
          git add -f output/
          if git diff --cached --quiet; then
            echo "Nessuna modifica alle playlist"
            exit 0
          fi

          git checkout --orphan latest
          git add -A
          git add -f output/
          git commit -m "Auto update playlist"
          git push --force origin latest:main
